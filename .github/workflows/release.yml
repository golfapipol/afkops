name: Release

# Publishing is driven by a tag, and the tag has to agree with package.json —
# otherwise you tag v0.3.0 and quietly publish 0.2.0 again.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # OIDC, for npm trusted publishing — no token stored anywhere

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs a recent npm; the runner's bundled version is
      # often older than the one that supports OIDC.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Refuse to republish an existing version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "afkops@$PKG" version >/dev/null 2>&1; then
            echo "::error::afkops@$PKG is already on the registry"
            exit 1
          fi

      - run: node --test

      - name: Publish to npm
        run: npm publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=notes.md
          if [ -f CHANGELOG.md ]; then
            # The section for this version, up to the next heading.
            awk -v v="## ${GITHUB_REF_NAME#v}" '
              $0 == v {found=1; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md > "$NOTES"
          fi
          [ -s "$NOTES" ] || echo "See CHANGELOG.md." > "$NOTES"
          gh release create "$GITHUB_REF_NAME" \
            --title "afkops ${GITHUB_REF_NAME#v}" \
            --notes-file "$NOTES" --latest
